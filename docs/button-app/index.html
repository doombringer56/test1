<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f7fb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Button App">
    <title>Button App</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172033;
        background: #f5f7fb;
      }
      main {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        justify-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      }
      h1 { margin: 0 0 48px; font-size: 34px; }
      .label { margin: 0; color: #5d6678; font-size: 18px; }
      output { margin: 4px 0 36px; font-size: 72px; font-weight: 700; }
      button {
        min-width: 180px;
        padding: 16px 28px;
        border: 0;
        border-radius: 12px;
        color: white;
        background: #2563eb;
        font: inherit;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      button:active { background: #1d4ed8; transform: scale(0.98); }
    </style>
  </head>
  <body>
    <main>
      <h1>Button App</h1>
      <p class="label">Button pressed</p>
      <output id="count">0</output>
      <button id="button" type="button">Press me</button>
    </main>
    <script>
      const count = document.querySelector('#count');
      document.querySelector('#button').addEventListener('click', () => {
        count.value = String(Number(count.value) + 1);
      });
    </script>
  </body>
</html>
